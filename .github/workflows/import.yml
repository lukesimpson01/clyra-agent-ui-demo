name: Import Clyra demo source
on:
  push:
    branches: [main]
    paths:
      - '.payload/part4.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand original source archive
        shell: bash
        run: |
          cat .payload/part{1,2,3,4}.b64 | base64 --decode | tar -xjvf -
          rm -rf .payload
      - name: Commit unpacked source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import full Clyra UI project source"
          git push
